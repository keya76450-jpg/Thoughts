<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise For You ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(125deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Eye casting background effect */
        .eye-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            align-items: center;
            opacity: 0.2;
            z-index: 1;
        }

        .eye {
            width: 90px;
            height: 90px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            border: 4px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
        }

        .pupil {
            width: 35px;
            height: 35px;
            background: #222;
            border-radius: 50%;
            position: absolute;
            transition: transform 0.1s ease-out;
        }

        /* Premium Card Container */
        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            width: 90%;
            max-width: 440px;
            z-index: 10;
            position: relative;
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Panda Avatar Animation */
        .panda-box {
            font-size: 85px;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.03); }
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
            line-height: 1.5;
            font-weight: 600;
        }

        /* Input styling */
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #fecfef;
            border-radius: 12px;
            margin-bottom: 25px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ff758c;
        }

        /* Buttons Layout */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
        }

        .btn-yes:hover {
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
        }

        .btn-no {
            background: #8e9aaf;
            color: white;
        }

        .btn-next {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #333;
            width: 100%;
        }

        /* Beautiful Dynamic End Text */
        .final-text {
            font-size: 18px;
            color: #444;
            line-height: 1.6;
            white-space: pre-line;
        }

        .highlight-text {
            color: #ff4d6d;
            font-weight: bold;
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Interactive Eye Background -->
    <div class="eye-background">
        <div class="eye"><div class="pupil"></div></div>
        <div class="eye"><div class="pupil"></div></div>
    </div>

    <div class="card">
        <!-- SCREEN 1: Are you prime minister? -->
        <div class="screen active" id="screen1">
            <div class="panda-box">🐼</div>
            <h2>Are you primeminister?</h2>
            <div class="btn-container">
                <button class="btn-yes" onclick="goToScreen('screen2A')">Yes</button>
                <button class="btn-no" onclick="goToScreen('screen2B')">No</button>
            </div>
        </div>

        <!-- SCREEN 2A: If Yes to Prime Minister -->
        <div class="screen" id="screen2A">
            <div class="panda-box">📝 🐼</div>
            <h2>How much work does a primeminister do in 24 hours?</h2>
            <input type="text" placeholder="Type your answer here...">
            <button class="btn-next" onclick="goToScreen('screen3')">Next</button>
        </div>

        <!-- SCREEN 2B: If No to Prime Minister -->
        <div class="screen" id="screen2B">
            <div class="panda-box">❓ 🐼</div>
            <h2>Why are you this much busy?</h2>
            <input type="text" placeholder="Type your answer here...">
            <button class="btn-next" onclick="goToScreen('screen3')">Next</button>
        </div>

        <!-- SCREEN 3: Should I Miss you or not? -->
        <div class="screen" id="screen3">
            <div class="panda-box">🤔 🐼</div>
            <h2>Should I Miss you or not?</h2>
            <div class="btn-container">
                <button class="btn-yes" onclick="goToScreen('screen4A')">Yes</button>
                <button class="btn-no" onclick="goToScreen('screen4B')">No</button>
            </div>
        </div>

        <!-- SCREEN 4A: If Yes to Miss You -->
        <div class="screen" id="screen4A">
            <div class="panda-box">👀 🐼</div>
            <h2>why ? do you love me?</h2>
            <div class="btn-container">
                <button class="btn-yes" onclick="showFinal(true)">Yes</button>
                <button class="btn-no" onclick="showFinal(false)">No</button>
            </div>
        </div>

        <!-- SCREEN 4B: If No to Miss You -->
        <div class="screen" id="screen4B">
            <div class="panda-box">🥺 🐼</div>
            <h2>i knew it your answer will rude, by the way i think i should.</h2>
            <button class="btn-next" onclick="showFinal(false)">Next</button>
        </div>

        <!-- FINAL SCREEN -->
        <div class="screen" id="screenFinal">
            <div class="panda-box">❤️ 🐼</div>
            <div class="final-text" id="finalTextContent"></div>
        </div>
    </div>

    <script>
        // Screen Navigation Logic
        function goToScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Show Final responses exactly how you requested
        function showFinal(saidYesToLove) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });

            let finalMessage = "";
            
            // If he clicked Yes to "why ? do you love me?"
            if (saidYesToLove) {
                finalMessage = `<span class="highlight-text">let's go! Winter is coming! i think January will be the best month</span>\n`;
            }
            
            // Main grand ending message
            finalMessage += `Btw so sweet of you. You are the gigantic iceberg which crashed the Titanic(Keya)`;

            document.getElementById('finalTextContent').innerHTML = finalMessage;
            document.getElementById('screenFinal').classList.add('active');
        }

        // Eye-tracking script
        document.addEventListener('mousemove', (e) => {
            const pupils = document.querySelectorAll('.pupil');
            pupils.forEach(pupil => {
                const eye = pupil.parentElement;
                const rect = eye.getBoundingClientRect();
                const eyeX = rect.left + rect.width / 2;
                const eyeY = rect.top + rect.height / 2;
                
                const angle = Math.atan2(e.clientX - eyeX, e.clientY - eyeY);
                const maxMovement = 18;
                
                const distance = Math.min(maxMovement, Math.hypot(e.clientX - eyeX, e.clientY - eyeY) / 12);
                
                const x = distance * Math.sin(angle);
                const y = distance * Math.cos(angle);
                
                pupil.style.transform = `translate(${x}px, ${y}px)`;

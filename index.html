<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only For You My Love ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe4e1 0%, #ffb6c1 100%);
            overflow: hidden;
            position: relative;
        }

        /* Romantic Background Floating Hearts */
        .hearts-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            display: block;
            background: rgba(255, 107, 129, 0.25);
            animation: floatUp 12s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        /* Eye Casting Background Effect */
        .eye-background {
            position: absolute;
            top: 5%;
            width: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            padding: 0 10%;
            opacity: 0.25;
            z-index: 2;
        }

        .eye {
            width: 75px;
            height: 75px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            border: 4px solid #4a1525;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .pupil {
            width: 30px;
            height: 30px;
            background: #4a1525;
            border-radius: 50%;
            position: absolute;
        }

        /* Top Love Badge */
        .for-you-badge {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            padding: 8px 22px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.4);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        /* Main Message Box Card */
        .card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            padding: 45px 35px;
            border-radius: 35px;
            box-shadow: 0 20px 45px rgba(233, 30, 99, 0.18);
            text-align: center;
            width: 92%;
            max-width: 450px;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.7);
        }

        /* FIXED SCREEN STATE CONTROL */
        .screen {
            display: none !important; /* Forces hidden screens to hide absolutely */
        }

        .screen.active {
            display: block !important; /* Forces active screen to show absolutely */
            animation: smoothFade 0.4s ease-out forwards;
        }

        @keyframes smoothFade {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Bear & Panda Cute Layout Group */
        .panda-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            margin-bottom: 25px;
            height: 110px;
        }

        .panda-bear {
            font-size: 78px;
            line-height: 1;
            display: inline-block;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.12));
        }

        /* Custom Emoji Dynamic Animations */
        .bounce .panda-bear:nth-child(1) { animation: jump 1.8s infinite ease-in-out; }
        .bounce .panda-bear:nth-child(2) { animation: jump 1.8s infinite ease-in-out; animation-delay: 0.2s; }

        .shy .panda-bear:nth-child(1) { transform: translateX(12px) rotate(12deg); animation: sway 2s infinite alternate ease-in-out; }
        .shy .panda-bear:nth-child(2) { transform: translateX(-12px) rotate(-12deg); animation: sway 2s infinite alternate ease-in-out; }

        .sad .panda-bear { animation: slump 2s infinite ease-in-out; }
        .love .panda-bear { animation: heartBeat 1s infinite alternate cubic-bezier(0.25, 0.8, 0.25, 1); }

        @keyframes jump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes sway {
            0% { transform: translateX(12px) rotate(8deg); }
            100% { transform: translateX(16px) rotate(15deg); }
        }
        @keyframes slump {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(8px) scaleY(0.85); }
        }
        @keyframes heartBeat {
            to { transform: scale(1.15); }
        }

        h2 {
            color: #4a1525;
            margin-bottom: 30px;
            font-size: 23px;
            font-weight: 600;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 22px;
            border: 2px solid #ffb6c1;
            border-radius: 18px;
            margin-bottom: 25px;
            outline: none;
            font-size: 16px;
            color: #4a1525;
            background: #fffafa;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #ff4757;
        }

        /* Buttons Layout */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 15px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            color: white;
            flex: 1;
        }

        .btn-yes:hover {
            transform: scale(1.05);
        }

        .btn-no {
            background: #e8e8e8;
            color: #6b7280;
            flex: 1;
        }

        .btn-no:hover {
            transform: scale(1.03);
        }

        .btn-next {
            background: linear-gradient(45deg, #2ed573, #26af5f);
            color: white;
            width: 100%;
        }

        .btn-next:hover {
            transform: scale(1.03);
        }
    </style>
</head>

            </div>
